<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard · Acme Notes</title>
    <script
      async
      src="http://localhost:5173/sdk/v1/firstfive.js"
      data-project-id="ffp_demo"
    ></script>
  </head>
  <body style="font: 16px system-ui; max-width: 640px; margin: 40px auto">
    <h1>Your dashboard</h1>
    <p>Welcome! You have no notes yet.</p>
    <button
      type="button"
      data-firstfive-id="open_settings"
      onclick="
        history.pushState(null, '', '/dashboard/settings');
        document.getElementById('settings').hidden = false;
      "
    >
      Settings
    </button>
    <section id="settings" hidden><h2>Settings</h2></section>
  </body>
</html>
